# 푸시·PR 마다 자동으로: 서버(Spring) 테스트 + 화면(React) 빌드
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 서버 테스트 (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 테스트 + jar 빌드
        working-directory: api
        run: sh ./mvnw -B -ntp verify

      - name: 실패하면 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports
          retention-days: 7

  frontend:
    name: 화면 빌드 (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 빌드
        run: npx vite build --outDir dist-ci --emptyOutDir
