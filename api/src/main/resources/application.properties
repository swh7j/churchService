spring.application.name=church-api
server.port=${PORT:8080}

# 경로는 api 폴더 기준 (환경변수로 바꿀 수 있음)
app.data-dir=${DATA_DIR:../data}
app.backup-dir=${BACKUP_DIR:../backups}
# 빌드된 React 화면 폴더 (npm run build 결과). 있으면 Spring이 화면도 같이 제공
app.web-dir=${WEB_DIR:../dist}
# HTTPS로 배포할 때 1 로 설정
app.cookie-secure=${COOKIE_SECURE:false}
# 서버 설치 코드: 설정하면 최초 관리자 계정을 만들 때 이 코드가 필요 (서버 설치 스크립트가 자동 생성)
app.setup-token=${SETUP_TOKEN:}

# Nginx 등 리버스 프록시 뒤에서 HTTPS 여부를 올바르게 인식
server.forward-headers-strategy=native

# 여러 교회: 처음부터 쓰던 data/church.db 를 이 코드의 교회로 등록 (주소 /c/코드)
app.default-church=${DEFAULT_CHURCH:suamjeil}
# 전체 관리자(교회 등록)가 속한 교회. 비우면 default-church
app.platform-church=${PLATFORM_CHURCH:}
